[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "project-brain"
version = "0.1.0"
description = "A per-project knowledge graph for AI coding agents: facts with evidence, peer verification, provenance."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
brain = "brain.cli:main"

[tool.setuptools]
packages = ["brain"]

[tool.setuptools.package-data]
brain = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
